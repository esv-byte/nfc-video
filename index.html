<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Video</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      object-fit: cover;
      background: #000;
    }
  </style>
</head>

<body>

  <video
    id="video"
    autoplay
    playsinline
    loop>
    
    <source
      src="d01a5b8e-f6d0-46d0-b61f-b7cb5162bea2.mov"
      type="video/quicktime">
  </video>

  <script>
    const video = document.getElementById("video");

    video.volume = 1;
    video.muted = false;

    window.addEventListener("load", () => {
      video.play().catch(() => {
        // Tarayıcı sesli autoplay'i engellerse
        // ilk dokunuşta başlat.
        document.addEventListener("click", () => {
          video.muted = false;
          video.volume = 1;
          video.play();
        }, { once: true });
      });
    });
  </script>

</body>
</html>
