<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Video</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      object-fit: cover;
      background: #000;
    }

    #hint {
      position: fixed;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%);
      color: white;
      font-family: -apple-system, sans-serif;
      font-size: 16px;
      background: rgba(0,0,0,.55);
      padding: 10px 18px;
      border-radius: 30px;
      z-index: 10;
    }
  </style>
</head>

<body>

  <video id="video" autoplay muted playsinline loop>
    <source
      src="d01a5b8e-f6d0-46d0-b61f-b7cb5162bea2.mov"
      type="video/quicktime">
  </video>

  <div id="hint">Ses için ekrana dokun</div>

  <script>
    const video = document.getElementById("video");
    const hint = document.getElementById("hint");

    document.addEventListener("click", async () => {
      video.muted = false;
      video.volume = 1;

      try {
        await video.play();
      } catch (e) {}

      hint.style.display = "none";
    }, { once: true });
  </script>

</body>
</html>
